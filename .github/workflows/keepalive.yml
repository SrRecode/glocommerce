name: keepalive

# Pings the deployed API so a free-tier instance does not spin down while idle.
# Set the repository variable API_HEALTH_URL (Settings -> Secrets and variables ->
# Actions -> Variables) to the full health endpoint, e.g.
#   https://glocommerce-api.onrender.com/api/v1/health
# The endpoint is exempt from the server's rate limiter, so pinging it is cheap.
#
# Note: GitHub disables scheduled workflows after 60 days without repository
# activity. If this ever stops running, re-enable it from the Actions tab or
# trigger it manually once with the "Run workflow" button.

on:
  schedule:
    # Every 10 minutes. Free tiers typically idle out after 15-30 minutes, so this
    # keeps comfortably ahead of the sleep timer.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping API health endpoint
        env:
          HEALTH_URL: ${{ vars.API_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "API_HEALTH_URL is not set; nothing to ping. Skipping."
            exit 0
          fi

          echo "Pinging $HEALTH_URL"
          curl \
            --silent \
            --show-error \
            --fail \
            --max-time 90 \
            --retry 2 \
            --retry-all-errors \
            --output /dev/null \
            --write-out "HTTP %{http_code} in %{time_total}s\n" \
            "$HEALTH_URL"
